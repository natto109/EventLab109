<!DOCTYPE html>
<html lang="th" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventLab109</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,300;0,400;0,500;0,700;0,800;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
/* ===== Tokens — สีจากโลโก้ EventLab109 (ไม่มี gradient) ===== */
:root{
  --bg:#FBF8F2; --surface:#FFFFFF; --surface-2:#F3EEE4;
  --ink:#141414; --muted:#5E5E5E; --line:#E6DFD2;
  --pink:#F11A81; --pink-soft:#FFE1EF;
  --green:#329C35; --green-soft:#E0F2DC;
  --shadow:#141414; --dim:rgba(20,20,20,.55);
  --ease:cubic-bezier(.2,.9,.25,1.15);
}
:root[data-theme="dark"]{
  --bg:#111411; --surface:#1B201B; --surface-2:#232A23;
  --ink:#F5F3EE; --muted:#A8B0A5; --line:#2E372E;
  --pink:#FF3D95; --pink-soft:#3B1528;
  --green:#4BC251; --green-soft:#183A1C;
  --shadow:#000000; --dim:rgba(0,0,0,.62);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Kanit',system-ui,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.x{font-style:italic;font-weight:900;letter-spacing:-.01em}

/* ===== Background: slanted solid blocks like the logo art ===== */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.slab{position:absolute;will-change:transform}
.sl1{width:60vw;height:120px;background:var(--pink);top:30vh;left:-48vw;transform:rotate(-8deg)}
.sl2{width:60vw;height:160px;background:var(--green);bottom:-110px;right:-15vw;transform:rotate(-8deg)}
.sl3{width:220px;height:26px;background:var(--ink);top:calc(30vh + 120px);left:-90px;transform:rotate(-8deg);opacity:.9}
.sl4{width:46vw;height:90px;background:var(--green);top:38vh;right:-30vw;transform:rotate(-8deg);opacity:.9}
.spark{position:absolute;width:22px;height:22px;background:var(--pink);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 3s ease-in-out infinite}
.sp1{top:22vh;left:6vw}.sp2{top:70vh;left:3vw;background:var(--green);animation-delay:1s;width:16px;height:16px}
.sp3{top:18vh;right:5vw;background:var(--green);animation-delay:.5s}
@keyframes twinkle{50%{transform:scale(.55) rotate(45deg)}}

/* ===== Header ===== */
header{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;background:var(--bg);border-bottom:2px solid transparent;transition:background-color .3s,border-color .3s,padding .3s}
header.scrolled{background:var(--bg);border-color:var(--line);padding-top:10px;padding-bottom:10px}
.wm{display:inline-flex;align-items:baseline;font-size:26px;line-height:1;transform:skewX(-6deg)}
.wm b{font-style:italic;font-weight:900}
.wm i{font-style:italic;font-weight:900;color:var(--pink)}
.wm .n{font-style:italic;font-weight:900;margin-left:4px;padding:2px 7px 3px;background:var(--green);color:#fff;border-radius:6px;font-size:18px;transform:translateY(-2px)}
.nav{display:flex;gap:6px;align-items:center}
.nav a{font-size:15px;font-weight:500;padding:8px 14px;border-radius:99px;transition:background-color .2s}
.nav a:hover{background:var(--surface-2)}
.toggle{width:64px;height:34px;border-radius:99px;background:var(--surface);border:2px solid var(--ink);position:relative;box-shadow:3px 3px 0 var(--shadow);margin-left:8px;transition:transform .15s,box-shadow .15s}
.toggle:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.knob{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--green);display:grid;place-items:center;transition:transform .45s var(--ease),background-color .3s}
.knob svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
:root[data-theme="dark"] .knob{transform:translateX(30px);background:var(--pink)}
.moon{display:none}:root[data-theme="dark"] .sun{display:none}:root[data-theme="dark"] .moon{display:block}

main{position:relative;z-index:1}

/* ===== Hero ===== */
.hero{max-width:min(1240px,max(780px,calc((100svh - 300px) * 1.5 + 40px)));margin:0 auto;padding:96px 20px 30px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;letter-spacing:.16em;font-weight:500;transform:skewX(-8deg)}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-size:clamp(34px,6vw,72px);line-height:1;margin-top:14px}
h1 .w{display:inline-block;opacity:0;transform:translateY(40px) skewX(-10deg);animation:wIn .7s var(--ease) forwards}
h1 .hl{color:var(--pink);position:relative}
h1 .hl::after{content:"";position:absolute;left:-4px;right:-6px;bottom:4px;height:14px;background:var(--green);z-index:-1;transform:skewX(-14deg) scaleX(0);transform-origin:left;animation:mark .6s ease 1.1s forwards}
@keyframes wIn{to{opacity:1;transform:none}}
@keyframes mark{to{transform:skewX(-14deg) scaleX(1)}}
.count{display:flex;gap:8px}
.count span{font-size:13px;font-weight:500;padding:6px 12px;border:2px solid var(--ink);border-radius:99px;background:var(--surface)}

/* stage = the logo artwork with service hotspots */
.stage{position:relative;border:3px solid var(--ink);border-radius:28px;box-shadow:10px 10px 0 var(--pink);overflow:hidden;background:var(--surface);aspect-ratio:3/2;user-select:none}
.stage img.art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .8s var(--ease)}
.stage.has-sel img.art{transform:scale(1.015)}
.focus{position:absolute;border:3px solid var(--pink);border-radius:20px;box-shadow:0 0 0 3000px var(--dim);opacity:0;pointer-events:none;z-index:3;
  transition:left .55s var(--ease),top .55s var(--ease),width .55s var(--ease),height .55s var(--ease),opacity .3s}
.stage.has-sel .focus{opacity:1}
.focus::before{content:"";position:absolute;inset:-9px;border:2px dashed var(--pink);border-radius:26px;animation:spinDash 12s linear infinite}
@keyframes spinDash{to{transform:rotate(1deg)}}

.dot{position:absolute;z-index:5;transform:translate(-50%,-50%);display:flex;align-items:center;gap:0}
.dot .pin{position:relative;width:44px;height:44px;border-radius:50%;background:var(--pink);color:#fff;border:3px solid #fff;display:grid;place-items:center;font-weight:800;font-style:italic;font-size:16px;
  box-shadow:3px 3px 0 #141414;transition:transform .3s var(--ease),background-color .2s}
.dot .pin::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:3px solid #fff;opacity:0;animation:ring 2s ease-out infinite}
.dot:nth-child(even) .pin{background:var(--green)}
.dot:nth-child(2) .pin::after{animation-delay:.3s}.dot:nth-child(3) .pin::after{animation-delay:.6s}.dot:nth-child(4) .pin::after{animation-delay:.9s}.dot:nth-child(5) .pin::after{animation-delay:1.2s}.dot:nth-child(6) .pin::after{animation-delay:1.5s}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.dot .lbl{margin-left:-6px;padding:6px 12px 6px 14px;background:#141414;color:#fff;font-size:12.5px;font-weight:700;font-style:italic;letter-spacing:.06em;white-space:nowrap;border-radius:0 8px 8px 0;
  clip-path:inset(0 100% 0 0);transition:clip-path .45s var(--ease);transform:skewX(-8deg)}
.dot.flip{flex-direction:row-reverse}
.dot.flip .lbl{margin:0 -6px 0 0;padding:6px 14px 6px 12px;border-radius:8px 0 0 8px;clip-path:inset(0 0 0 100%)}
.stage:hover .dot .lbl,.stage.peek .dot .lbl{clip-path:inset(0 0 0 0)}
.stage .dot:nth-child(2) .lbl{transition-delay:.04s}.stage .dot:nth-child(3) .lbl{transition-delay:.08s}.stage .dot:nth-child(4) .lbl{transition-delay:.12s}.stage .dot:nth-child(5) .lbl{transition-delay:.16s}.stage .dot:nth-child(6) .lbl{transition-delay:.2s}
.dot:hover .pin,.dot.on .pin,.dot:focus-visible .pin{transform:scale(1.18) rotate(-8deg)}
.dot.on .lbl{background:var(--pink)}
.stage.has-sel .dot:not(.on) .lbl{clip-path:inset(0 100% 0 0)}
.stage.has-sel .dot.flip:not(.on) .lbl{clip-path:inset(0 0 0 100%)}
.dot:focus-visible{outline:none}

/* service card, appears on the opposite side of the hotspot */
.card{position:absolute;z-index:6;top:50%;width:min(370px,38%);background:var(--surface);border:3px solid var(--ink);border-radius:24px;box-shadow:8px 8px 0 var(--shadow);padding:22px 22px 20px;
  opacity:0;pointer-events:none;transform:translateY(-50%) translateX(0) scale(.9) rotate(2deg);transition:opacity .25s,transform .55s var(--ease),left .45s var(--ease),right .45s var(--ease)}
.card.r{right:22px;left:auto}.card.l{left:22px;right:auto}
.stage-wrap{position:relative}
.stage-wrap.has-sel .card{opacity:1;pointer-events:auto;transform:translateY(-50%) rotate(0)}
.card .tag{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:99px;background:var(--c);color:#fff;font-size:12px;font-weight:700;font-style:italic;letter-spacing:.08em}
.card .tag b{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--c);display:grid;place-items:center;font-size:12px}
.card h3{font-size:26px;font-weight:800;line-height:1.15;margin:12px 0 8px}
.card p{font-size:14.5px;line-height:1.65;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.tags span{font-size:12px;padding:3px 10px;border-radius:6px;border:1.5px solid var(--line)}
.shots{display:flex;gap:8px;margin-top:14px}
.shots:empty{display:none}
.shot{flex:1;max-width:33%;aspect-ratio:4/3;border-radius:10px;border:2px solid var(--ink);overflow:hidden;cursor:zoom-in;padding:0;background:var(--surface-2);
  opacity:0;transform:translateY(14px) rotate(-4deg);animation:shotIn .5s var(--ease) forwards}
.shot:nth-child(2){animation-delay:.08s;--r:3deg}.shot:nth-child(3){animation-delay:.16s}
.shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.shot:hover img{transform:scale(1.08)}
@keyframes shotIn{to{opacity:1;transform:none}}
.go{margin-top:16px;display:inline-flex;align-items:center;gap:8px;font-size:14.5px;font-weight:500;padding:9px 16px;border-radius:99px;background:var(--ink);color:var(--bg);transition:transform .2s,background-color .2s}
.go:hover{transform:translateX(4px);background:var(--pink);color:#fff}
.go svg{width:16px;height:16px}
.card-body{transition:opacity .18s,transform .25s var(--ease)}
.card-body.swap{opacity:0;transform:translateY(8px)}

/* ===== Service tiles ===== */
.services{max-width:1240px;margin:0 auto;padding:40px 20px 20px}
.sec-title{display:flex;align-items:baseline;gap:14px;margin-bottom:24px;flex-wrap:wrap}
.sec-title h2{font-size:clamp(30px,4.4vw,48px);line-height:1}
.sec-title > span{color:var(--pink);font-size:17px;font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{position:relative;text-align:left;padding:20px;border-radius:22px;background:var(--surface);border:2.5px solid var(--ink);overflow:hidden;
  transition:transform .3s var(--ease),box-shadow .2s,background-color .25s,color .25s}
.tile::before{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;background:var(--c);transform:rotate(-12deg);opacity:.14;transition:opacity .3s,transform .5s var(--ease)}
.tile .num{position:absolute;right:16px;top:8px;font-size:46px;font-weight:900;font-style:italic;color:var(--c);opacity:.9;line-height:1}
.tile .ico{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;transform:rotate(-6deg);transition:transform .4s var(--ease)}
.tile h3{font-size:19px;font-weight:700;margin-top:14px;line-height:1.25}
.tile small{display:block;font-size:12px;font-weight:700;font-style:italic;letter-spacing:.1em;color:var(--muted);margin-top:4px}
.tile:hover,.tile.on{transform:translate(-4px,-4px);box-shadow:7px 7px 0 var(--c)}
.tile:hover::before,.tile.on::before{opacity:.3;transform:rotate(-12deg) scale(1.4)}
.tile:hover .ico,.tile.on .ico{transform:rotate(6deg) scale(1.08)}

/* ===== Marquee ===== */
.bands{position:relative;height:150px;margin:40px 0 20px;overflow:hidden}
.band{position:absolute;left:-5%;width:110%;padding:13px 0;white-space:nowrap;overflow:hidden;border-top:3px solid var(--ink);border-bottom:3px solid var(--ink)}
.band.b1{background:var(--pink);color:#fff;top:30px;transform:rotate(-4deg);z-index:2}
.band.b2{background:var(--green);color:#fff;top:52px;transform:rotate(3deg)}
.track{display:inline-block;animation:marq 26s linear infinite;font-size:22px;font-weight:900;font-style:italic;letter-spacing:.03em}
.b2 .track{animation-direction:reverse;animation-duration:32s}
.track span{margin:0 16px}
.track .st{display:inline-block;width:14px;height:14px;background:currentColor;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);vertical-align:middle}
@keyframes marq{to{transform:translateX(-50%)}}

/* ===== Contact ===== */
.contact{max-width:1240px;margin:0 auto;padding:40px 20px 60px;scroll-margin-top:70px}
.cgrid{display:grid;grid-template-columns:1.05fr 1fr;gap:22px}
.cta{position:relative;overflow:hidden;background:var(--ink);color:var(--bg);border-radius:26px;padding:34px;display:flex;flex-direction:column;justify-content:center;min-height:260px}
.cta h3{font-size:clamp(26px,3.2vw,38px);font-weight:800;font-style:italic;line-height:1.2;position:relative}
.cta h3 em{color:var(--pink);font-style:italic}
.cta p{margin-top:12px;font-size:17px;opacity:.8;position:relative}
.cta .s1{position:absolute;right:-50px;bottom:-30px;width:240px;height:70px;background:var(--pink);transform:rotate(-10deg)}
.cta .s2{position:absolute;right:-30px;bottom:40px;width:180px;height:40px;background:var(--green);transform:rotate(-10deg)}
.cta .s3{position:absolute;right:34px;top:30px;width:26px;height:26px;background:var(--pink);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 3s infinite}
.rows{display:grid;gap:12px}
.row{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--surface);border:2.5px solid var(--line);transition:border-color .2s,transform .25s var(--ease),box-shadow .2s}
a.row:hover{border-color:var(--ink);transform:translate(-3px,-3px);box-shadow:5px 5px 0 var(--shadow)}
.row .ri{flex:none;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--pink);color:#fff;transform:rotate(-6deg)}
.row:nth-child(2) .ri{background:var(--green)}
.row:nth-child(3) .ri{background:var(--ink);color:var(--bg)}
.row .lbl{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.row .val{font-weight:500;font-size:17px;word-break:break-word}
.row .cp{margin-left:auto;flex:none;white-space:nowrap;font-size:12.5px;color:var(--muted);padding:6px 12px;border-radius:99px;border:1.5px solid var(--line);transition:background-color .2s,color .2s}
.row .cp:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}

footer{position:relative;z-index:1;text-align:center;padding:24px 16px 40px;font-size:13.5px;color:var(--muted)}
footer b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-size:14px;z-index:60;transition:transform .45s var(--ease)}
.toast.show{transform:translate(-50%,0)}
.lb{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:rgba(20,20,20,.75);opacity:0;pointer-events:none;transition:opacity .3s}
.lb.show{opacity:1;pointer-events:auto}
.lb img{max-width:min(92vw,1100px);max-height:84vh;border-radius:16px;border:3px solid #fff;transform:scale(.85) rotate(-3deg);transition:transform .45s var(--ease)}
.lb.show img{transform:none}
.lb button{position:absolute;top:20px;right:20px;width:44px;height:44px;border-radius:50%;background:#fff;color:#141414;font-size:22px}
.rv{opacity:0;transform:translateY(36px);transition:opacity .7s ease,transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ===== Mobile ===== */
@media (max-width:820px){
  header{padding:12px 16px}
  .nav{gap:0}
  .nav a{font-size:13px;padding:6px 7px}
  .toggle{width:54px;height:30px;margin-left:4px}.knob{width:20px;height:20px}
  :root[data-theme="dark"] .knob{transform:translateX(24px)}
  .sl1,.sl2,.sl3,.sl4{display:none}
  .wm{font-size:19px}
  .wm .n{font-size:13px}
  header{padding-left:12px;padding-right:12px}
  .hero{padding-top:84px}
  .count{display:none}
  .stage{border-radius:20px;box-shadow:6px 6px 0 var(--pink)}
  .dot .pin{width:30px;height:30px;font-size:12px;border-width:2px}
  .dot .pin::after{inset:-5px;border-width:2px}
  .dot .lbl{display:none}
  .focus{border-radius:12px}
  .card{position:relative;top:auto;left:auto!important;right:auto!important;width:100%;margin-top:18px;transform:none!important;opacity:1;pointer-events:auto;display:none}
  .stage-wrap.has-sel .card{display:block;animation:pop .45s var(--ease)}
  .tiles{grid-template-columns:1fr 1fr;gap:10px}
  .tile{padding:14px}
  .tile .num{font-size:32px}
  .tile .ico{width:40px;height:40px}
  .tile h3{font-size:15.5px}
  .tile small{font-size:10px}
  .cgrid{grid-template-columns:1fr}
  .cta{padding:26px;min-height:200px}
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}h1 .w,.rv,.shot{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true">
  <div class="slab sl1" data-d="14"></div><div class="slab sl2" data-d="20"></div>
  <div class="slab sl3" data-d="30"></div><div class="slab sl4" data-d="10"></div>
  <div class="spark sp1"></div><div class="spark sp2"></div><div class="spark sp3"></div>
</div>

<header>
  <a href="#top" class="wm" aria-label="EventLab109"><b>Event</b><i>Lab</i><span class="n">109</span></a>
  <nav class="nav">
    <a href="blog.html?v=2">Blog</a>
    <a href="#services">Service</a>
    <a href="#contact">Contact</a>
    <button class="toggle" id="themeBtn" aria-label="สลับโหมดสว่าง/มืด"><span class="knob">
      <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
  </nav>
</header>

<main id="top">
  <section class="hero">
    <div class="hero-top">
      <div>
        <span class="badge"><i></i>EVENTLAB109 STUDIO</span>
        <h1 class="x" id="headline"></h1>
      </div>
    </div>

};

/* ============ Hotspots + tiles ============ */
const stage = document.getElementById("stage"), wrap = document.getElementById("stageWrap"),
      dotsEl = document.getElementById("dots"), focusEl = document.getElementById("focus"),
      card = document.getElementById("card"), cardBody = document.getElementById("cardBody"),
      tilesEl = document.getElementById("tiles");
const isMobile = () => matchMedia("(max-width:820px)").matches;

SERVICES.forEach((s, i) => {
  const n = String(i+1).padStart(2,"0");
  const d = document.createElement("button");
  d.className = "dot" + (s.x > 60 ? " flip" : "");
  d.style.left = s.x + "%"; d.style.top = s.y + "%";
  d.setAttribute("aria-label", s.title);
  d.innerHTML = `<span class="pin">${i+1}</span><span class="lbl">${n} ${s.en}</span>`;
  d.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") select(i); });
  d.addEventListener("click", () => select(i));
  d.addEventListener("focus", () => select(i));
  dotsEl.appendChild(d); s.dot = d;

  const t = document.createElement("button");
  t.className = "tile rv"; t.style.cssText = `--c:var(--${s.c});transition-delay:${i*50}ms`;
  t.innerHTML = `<span class="num">${n}</span><span class="ico">${svg(s.icon)}</span><h3>${s.title}</h3><small>${s.en}</small>`;
  t.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") select(i, true); });
  t.addEventListener("click", () => { select(i, true); stage.scrollIntoView({behavior:"smooth", block:"center"}); });
  tilesEl.appendChild(t); s.tile = t;
});

let current = -1, clearTimer;
function select(i, fromTile){
  clearTimeout(clearTimer);
  if (i === current) return;
  current = i;
  const s = SERVICES[i];
  try { window.elTrack && window.elTrack.service(i); } catch(e){}   // ตัวนับหลังบ้าน
  SERVICES.forEach((o,k) => { o.dot.classList.toggle("on", k===i); o.tile.classList.toggle("on", k===i); });
  const [l,t,w,h] = s.box;
  Object.assign(focusEl.style, { left:l+"%", top:t+"%", width:w+"%", height:h+"%" });
  focusEl.style.borderColor = `var(--${s.c})`;
  stage.classList.add("has-sel"); wrap.classList.add("has-sel");
  const side = (s.x < 50) ? "r" : "l";
  card.className = "card " + side;
  card.style.setProperty("--c", `var(--${s.c})`);
  cardBody.classList.add("swap");
  setTimeout(() => {
    cardBody.innerHTML = `<span class="tag"><b>${i+1}</b>${s.en}</span>
      <h3>${s.title}</h3><p>${s.desc}</p>
      <div class="tags">${s.tags.map(x => `<span>${x}</span>`).join("")}</div>
      <div class="shots" id="shots"></div>
      <a class="go" href="#contact">สอบถามบริการนี้ ${svg("arrow")}</a>`;
    cardBody.classList.remove("swap");
    showShots(i);
  }, 140);
}
function clearSel(){
  current = -1;
  stage.classList.remove("has-sel"); wrap.classList.remove("has-sel");
  SERVICES.forEach(o => { o.dot.classList.remove("on"); o.tile.classList.remove("on"); });
}
stage.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !isMobile()) clearTimer = setTimeout(clearSel, 600); });
stage.addEventListener("pointerenter", () => clearTimeout(clearTimer));
tilesEl.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !isMobile()) clearTimer = setTimeout(clearSel, 600); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { lb.classList.remove("show"); clearSel(); } });

setTimeout(() => { stage.classList.add("peek"); setTimeout(() => stage.classList.remove("peek"), 2200); }, 900);

const MAX_IMG = 3;
const imgCache = {};
const probe = src => new Promise(r => { const im = new Image(); im.onload = () => r(src); im.onerror = () => r(null); im.src = src; });
async function probeAny(base){ for (const e of IMG_EXT){ const ok = await probe(`${base}.${e}`); if (ok) return ok; } return null; }
function loadImgs(i){
  if (!imgCache[i]) imgCache[i] = Promise.all([...Array(MAX_IMG)].map((_,k) => probeAny(`${IMG_DIR}${i+1}-${k+1}`)))
    .then(a => { a = a.filter(Boolean); if (!a.length) delete imgCache[i]; return a; });
  return imgCache[i];
}
SERVICES.forEach((_, i) => loadImgs(i));
async function showShots(i){
  const list = await loadImgs(i);
  const el = document.getElementById("shots");
  if (!el || current !== i) return;
  el.innerHTML = list.map((src,k) => `<button class="shot" data-src="${src}"><img src="${src}" alt="${SERVICES[i].title} ภาพที่ ${k+1}"></button>`).join("");
}
const lb = document.getElementById("lb");
cardBody.addEventListener("click", e => { const b = e.target.closest(".shot"); if (!b) return; lb.querySelector("img").src = b.dataset.src; lb.classList.add("show"); });
lb.addEventListener("click", () => lb.classList.remove("show"));

/* ============ Marquee ============ */
const kw = ["REGISTER","INTERACTIVE GAME","AI PHOTO BOOTH","LUCKY DRAW","CHECK-IN","LIVE QUIZ","BINGO","TOUCHSCREEN INFORMATION"];
const seq = a => a.map(k => `<span>${k}</span><i class="st"></i>`).join("");
document.getElementById("track1").innerHTML = seq(kw).repeat(2);
document.getElementById("track2").innerHTML = seq([...kw].reverse()).repeat(2);

/* ============ Contact ============ */
const rows = [
  { icon:"phone", lbl:"โทรศัพท์", val:CONFIG.phone, href:`tel:${CONFIG.phone.replace(/[^0-9+]/g,"")}`, copy:true },
  { icon:"mail",  lbl:"อีเมล", val:CONFIG.email, href:`mailto:${CONFIG.email}`, copy:true },
  CONFIG.lineReady ? { icon:"line", lbl:"LINE Official", val:CONFIG.lineId, href:CONFIG.lineUrl, copy:true }
                   : { icon:"line", lbl:"LINE", val:"<i>เร็ว ๆ นี้</i>" }
];
document.getElementById("rows").innerHTML = rows.map((r,i) => {
  const tag = r.href ? `a href="${r.href}"${r.href.startsWith("http") ? ' target="_blank" rel="noopener"' : ""}` : "div";
  return `<${tag} class="row rv" style="transition-delay:${i*70}ms"><span class="ri">${svg(r.icon)}</span>
    <span><span class="lbl">${r.lbl}</span><br><span class="val">${r.val}</span></span>
    ${r.copy ? `<button class="cp" data-copy="${r.val}">คัดลอก</button>` : ""}</${r.href ? "a" : "div"}>`;
}).join("");
const toast = document.getElementById("toast");
document.addEventListener("click", e => {
  const b = e.target.closest(".cp"); if (!b) return;
  e.preventDefault(); e.stopPropagation();
  const v = b.dataset.copy;
  (navigator.clipboard ? navigator.clipboard.writeText(v) : Promise.reject()).then(() => show(`คัดลอก ${v} แล้ว`)).catch(() => show(v));
  function show(m){ toast.textContent = m; toast.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => toast.classList.remove("show"), 1800); }
});

/* ============ Scroll + parallax ============ */
const hdr = document.querySelector("header");
addEventListener("scroll", () => hdr.classList.toggle("scrolled", scrollY > 20), { passive:true });
const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold:.12 });
document.querySelectorAll(".rv").forEach(el => io.observe(el));
const slabs = [...document.querySelectorAll(".slab")];
let mx = .5, my = .5;
addEventListener("pointermove", e => { mx = e.clientX / innerWidth; my = e.clientY / innerHeight; }, { passive:true });
(function loop(){
  slabs.forEach(s => { const d = +s.dataset.d; s.style.translate = `${(.5-mx)*d}px ${(.5-my)*d - scrollY*d/60}px`; });
  requestAnimationFrame(loop);
})();
</script>
